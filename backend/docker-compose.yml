services:
  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    volumes:
      - models:/app/models
      - data:/app/data
    environment:
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models:ro
      - data:/app/data:ro
    depends_on:
      trainer:
        condition: service_completed_successfully
    environment:
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evaluator:
    build:
      context: .
      dockerfile: evaluator/Dockerfile
    volumes:
      - models:/app/models:ro
      - eval-output:/app/output
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - METRICS_OUTPUT=/app/output/metrics.json

volumes:
  models:
  data:
  eval-output:
