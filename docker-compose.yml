services:
  # ---- ML Trainer: trains KMeans and saves model to shared volume ----
  trainer:
    build:
      context: ./backend
      dockerfile: trainer/Dockerfile
    volumes:
      - models:/app/models
      - data:/app/data
    environment:
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models

  # ---- FastAPI: loads persisted model and serves endpoints ----
  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models:ro
      - data:/app/data:ro
    depends_on:
      trainer:
        condition: service_completed_successfully
    environment:
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---- Evaluator: runs after API is healthy, writes metrics.json ----
  evaluator:
    build:
      context: ./backend
      dockerfile: evaluator/Dockerfile
    volumes:
      - eval-output:/app/output
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - METRICS_OUTPUT=/app/output/metrics.json

  # ---- Frontend: React dashboard served by nginx ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  models:
  data:
  eval-output:
